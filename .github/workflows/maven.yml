name: REST Assured API Tests

on:
  push:
    branches: [ "rest-assured-basic-crud" ]
  pull_request:
    branches: [ "rest-assured-basic-crud" ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run REST Assured Tests
        run: mvn -B clean test
